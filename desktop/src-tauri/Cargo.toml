[package]
name = "aeflow-desktop"
version = "0.1.1"
description = "Ultra-clean lightweight Tauri v2 desktop companion for AgentEverywhereFlow"
authors = ["AgentEverywhereFlow Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aeflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
