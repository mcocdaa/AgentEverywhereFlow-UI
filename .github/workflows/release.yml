name: Release WebUI & Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: read

jobs:
  build-webui:
    name: Build WebUI Studio Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify version parity across WebUI & Desktop
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -c "import json, os, tomllib; expected = os.environ['GITHUB_REF_NAME'].removeprefix('v'); versions = {'package.json': json.load(open('package.json'))['version'], 'desktop/package.json': json.load(open('desktop/package.json'))['version'], 'desktop/src-tauri/tauri.conf.json': json.load(open('desktop/src-tauri/tauri.conf.json'))['version'], 'desktop/src-tauri/Cargo.toml': tomllib.load(open('desktop/src-tauri/Cargo.toml', 'rb'))['package']['version']}; assert all(v == expected for v in versions.values()), f'Version mismatch (expected {expected}): {versions}'; print('Version parity OK:', versions)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Quality (oxlint)
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build

      - name: Package dist into webui-dist.zip
        run: |
          test -f dist/index.html
          mkdir -p release-assets
          (cd dist && zip -r ../release-assets/webui-dist.zip .)

      - name: Upload WebUI bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: webui-bundle
          path: release-assets/webui-dist.zip
          if-no-files-found: error

  build-desktop:
    name: Build AEFlow Desktop (${{ matrix.name }})
    needs: build-webui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            bundles: dmg
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            tauri_args: "--target universal-apple-darwin --bundles dmg"
          - name: linux-x64
            os: ubuntu-22.04
            bundles: "deb,appimage"
            rust_targets: ""
            tauri_args: "--bundles deb,appimage"
          - name: windows-x64
            os: windows-latest
            bundles: "msi,nsis"
            rust_targets: ""
            tauri_args: "--bundles msi,nsis"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri native installers (${{ matrix.bundles }})
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build ${{ matrix.tauri_args }}

      - name: Collect built installers
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            desktop/src-tauri/target/release/bundle/deb/*.deb \
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            desktop/src-tauri/target/release/bundle/msi/*.msi \
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe; do
            cp -v "$f" release-assets/
          done
          count=$(ls -1 release-assets | wc -l)
          echo "Collected $count installer artifact(s) for ${{ matrix.name }}"
          ls -lh release-assets/
          test "$count" -ge 1

      - name: Upload Desktop installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-webui, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List collected release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v0.2.0' }}
          files: |
            release-assets/webui-dist.zip
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.msi
            release-assets/*-setup.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
